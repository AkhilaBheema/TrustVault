name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustvault
          POSTGRES_PASSWORD: trustvault_secret
          POSTGRES_DB: trustvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: TypeScript Typecheck
        run: |
          cd backend && npx tsc --noEmit

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://trustvault:trustvault_secret@localhost:5432/trustvault_test
        run: |
          npx tsx db/migrate.ts

      - name: Run Database Seed & Verify Isolation
        env:
          DATABASE_URL: postgresql://trustvault:trustvault_secret@localhost:5432/trustvault_test
        run: |
          npx tsx db/seed.ts

      - name: Execute Vitest Test Suite
        env:
          DATABASE_URL: postgresql://trustvault:trustvault_secret@localhost:5432/trustvault_test
          MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_SECRET: ci_test_session_secret_at_least_32_bytes_long_123456
          NODE_ENV: test
        run: |
          cd backend && npm test
