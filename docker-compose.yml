version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trustvault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: trustvault_secret
      POSTGRES_DB: trustvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trustvault:trustvault_secret@db:5432/trustvault
      PORT: 4000
      NODE_ENV: production
      MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: super_secret_session_signing_key_at_least_32_bytes_long_123456
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
