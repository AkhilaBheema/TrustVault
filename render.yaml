services:
  - type: web
    name: trustvault-api
    runtime: node
    buildCommand: npm ci && npm --prefix backend ci && npm run backend:build
    startCommand: npm run db:migrate && npm run backend:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: MASTER_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: STORAGE_DIR
        value: /var/data/uploads
    disk:
      name: trustvault-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault
