services:
  - type: web
    name: trustvault-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm --prefix backend ci && npm run backend:build
    startCommand: node backend/dist/db/migrate.js && npm run backend:start
    initialDeployHook: npm run db:seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: strict
      - key: MASTER_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/uploads
    disk:
      name: trustvault-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: trustvault-db
    plan: 0.1c-256mb
    databaseName: trustvault
    user: trustvault
